# Render Blueprint: https://render.com/docs/blueprint-spec
# In the Render dashboard: New > Blueprint > pick this repository.
services:
  - type: web
    name: umrah-trip-planner-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://umrah-trip-planner.vercel.app
